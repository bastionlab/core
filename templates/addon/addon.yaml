# one add-on: this file is what the Add-ons page and the marketplace show
id: __ID__
name: __NAME__
icon: spark            # a name from web/app/components/Icon.vue in the core
order: 50              # where its tab sits among the add-on tabs
author: __AUTHOR__
license: MIT           # SPDX id of this add-on's license; the core's AGPL-3.0 does not cover add-ons
# warning: Scrapes example.com, whose terms forbid it. Personal use only.   # shown on its card and before install
version: 0.1.0         # bump on every release; installs see "update to vX" when this is higher than theirs
desc: One or two lines on what it does for you.
routes: [/__ID__]
needs: []              # what the box needs, e.g. [own CT, Claude login, NVIDIA GPU]
depends_on: []         # other add-on ids, e.g. [ai]
# roles: { view: viewer, use: admin }   # who sees its pages / reads its API, who changes things; default owner only
# admin_actions: [my_action]             # its actions an admin may run (others: owner)
# ct: __ID__           # config.json `cts` key if it lives in its own container (install.sh creates it)
# apps:                # web apps it brings: a Home tile (group: app) + a health check
#   - { name: __NAME__, icon: "🧩", note: "What it is", group: app, ct: __ID__, port: 8080, health: / }
